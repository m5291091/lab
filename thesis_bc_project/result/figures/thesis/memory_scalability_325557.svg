   <g id="text_19">
    <text style="font: 7.5px 'DejaVu Sans'" transform="translate(54.869531 431.620153)">Targeted feasibility boundary on the corrected 325557 graph (job 2404743); each configuration n=1. Wall-clock times are single-run feasibility values at different requested batches and are NOT a performance comparison.</text>
    <text style="font: 7.5px 'DejaVu Sans'" transform="translate(7.2 440.018512)">Max successful requested batch is within the tested range only (Pure 4096 &lt; UM 10240 &lt; Chunked 16384); Chunked was tested to 16384 and this is no unlimited-capacity claim. Points are not connected (unmeasured batches were not measured).</text>
   </g>
