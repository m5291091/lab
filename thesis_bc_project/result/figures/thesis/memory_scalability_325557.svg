   <g id="text_19">
    <text style="font: 7.5px 'DejaVu Sans'" transform="translate(82.597852 416.502028)">Targeted feasibility boundary on the corrected 325557 graph; each configuration n=1. Wall-clock times are single-run feasibility values at different requested batches and are NOT a performance comparison.</text>
    <text style="font: 7.5px 'DejaVu Sans'" transform="translate(7.2 424.900387)">Max successful requested batch is within the tested range only (Pure 4096 &lt; UM 10240 &lt; Chunked 16384); Chunked was tested to 16384 and this is no unlimited-capacity claim. Points are not connected (unmeasured batches were not measured).</text>
   </g>
